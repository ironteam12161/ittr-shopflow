<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Iron Team — Customer Approval</title>
<link rel="icon" href="/assets/app-icon-192.png">
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#14171c;--mut:#5d6672;--line:#e2e5ea;--accent:#c2410c;--accent-ink:#fff;--ok:#067647;--ok-bg:#ecfdf3;--no:#b42318;--no-bg:#fef3f2;--warn:#b54708;--warn-bg:#fffaeb}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#171a20;--ink:#eceef1;--mut:#9aa3ae;--line:#2a2f37;--accent:#f97316;--accent-ink:#1a0f06;--ok:#5fd394;--ok-bg:#0f2a1c;--no:#ff8a80;--no-bg:#2d1513;--warn:#f5c35b;--warn-bg:#2a2210;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right)) 48px max(16px,env(safe-area-inset-left));display:grid;gap:14px}
header.shop{display:flex;gap:12px;align-items:center;padding:6px 0 4px}
header.shop img{width:52px;height:52px;object-fit:contain;border-radius:10px;background:#111}
header.shop b{display:block;font-size:17px}header.shop span{color:var(--mut);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:10px}
h1{font-size:22px;margin:0;line-height:1.2}h2{font-size:17px;margin:0}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--mut);font-size:14px}
.job{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:8px}
.job.approved{border-color:var(--ok);background:var(--ok-bg)}.job.declined{border-color:var(--no);background:var(--no-bg)}
.jobHead{display:flex;justify-content:space-between;gap:10px;align-items:baseline}.jobHead b{font-size:16px}
.amt{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.lines{margin:0;padding:0;list-style:none;font-size:14px;color:var(--mut);display:grid;gap:2px}
.lines li{display:flex;justify-content:space-between;gap:10px}.lines li span:last-child{font-variant-numeric:tabular-nums;white-space:nowrap}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choice button{min-height:46px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:600 15px inherit;cursor:pointer}
.choice button[aria-pressed="true"].yes{background:var(--ok);border-color:var(--ok);color:#fff}
.choice button[aria-pressed="true"].no{background:var(--no);border-color:var(--no);color:#fff}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px}
.tag.ok{background:var(--ok-bg);color:var(--ok)}.tag.no{background:var(--no-bg);color:var(--no)}.tag.wait{background:var(--warn-bg);color:var(--warn)}
.totals{display:grid;gap:4px;font-size:15px}.totals div{display:flex;justify-content:space-between;gap:10px}.totals .big{font-size:19px;font-weight:800;border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
label.f{display:grid;gap:4px;font-size:14px;font-weight:600}
input[type=text],textarea{width:100%;font:16px inherit;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.agree{display:flex;gap:10px;align-items:flex-start;font-size:14px}.agree input{width:22px;height:22px;margin-top:2px;flex-shrink:0}
.submit{min-height:52px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font:700 17px inherit;cursor:pointer}
.submit:disabled{opacity:.55;cursor:default}
.err{color:var(--no);font-weight:600;font-size:14px}.muted{color:var(--mut);font-size:14px}
.photos{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}.photos img{height:110px;border-radius:8px;cursor:zoom-in;flex-shrink:0}
.flag{display:grid;gap:2px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}.flag:first-child{border-top:0}
.done{text-align:center;padding:28px 16px}.done .big{font-size:44px}
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;padding:12px;z-index:9}.zoom img{max-width:100%;max-height:100%;border-radius:8px}
footer{color:var(--mut);font-size:13px;text-align:center}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="card"><div class="muted">Loading…</div></div></div>
<script src="/customer.js?v=24.54.0"></script>
</body>
</html>
